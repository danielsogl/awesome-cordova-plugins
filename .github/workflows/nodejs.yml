name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -- --quiet

      - name: Check formatting
        run: npx prettier --check --ignore-unknown "**/*"

      # The ngx build emits via EmitFlags.Metadata without reporting diagnostics,
      # so without this step type errors ship silently. See scripts/build/ngx.ts.
      - name: Type check
        run: npm run typecheck

      # thresholds in vitest.config.ts fail the run if core/ drops below 100%
      - name: Test
        run: npm run test:coverage

      - name: Build
        run: npm run build
